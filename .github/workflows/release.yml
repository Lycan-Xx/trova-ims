name: Release

# Runs on every push to main. release-please opens (and keeps updated)
# a "Release PR" that bumps the version and builds the changelog from
# conventional commits. Merging that PR builds release candidates first;
# publication is held behind the protected production-release environment.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Step 1: let release-please manage the version + changelog ─────────────
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node
          # Keeps the version in package.json in sync with the release tag.
          # Also updates src-tauri/Cargo.toml automatically.
          extra-files: |
            src-tauri/Cargo.toml

  # ── Step 2: keep the release private while candidates are tested ──────────
  prepare-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as draft candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft=true --prerelease=true

  # ── Step 3: build Windows candidate installers ────────────────────────────
  # Only runs when release-please actually created a new release (i.e.
  # the Release PR was just merged). Skipped on regular feature pushes.
  build-candidate:
    needs: [release-please, prepare-release]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-slim
            variant: slim
            bundles: msi,nsis
          - platform: windows-latest
            name: windows-bundled
            variant: bundled
            bundles: msi,nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://build:build@localhost:5432/build' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'build-time-placeholder-not-used-for-signing' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        run: >
          npm run desktop:build --
          --variant ${{ matrix.variant }}
          --target x86_64-pc-windows-msvc
          --bundles ${{ matrix.bundles }}

      # These artifacts are the release candidates. Test them manually before
      # approving the protected publish-release job below.
      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trova-ims-${{ matrix.name }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [release-please, prepare-release, build-candidate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-release
    concurrency:
      group: production-release
      cancel-in-progress: false

    steps:
      - name: Download tested candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: trova-ims-windows-*
          merge-multiple: true
          path: release-assets

      - name: Publish Windows installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.msi' -o -name '*.exe' \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Windows installer assets were downloaded."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false

