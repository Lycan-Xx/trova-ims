<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trova IMS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #9a9a9f;
      }
      .wrap { text-align: center; }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f5610a;
        margin: 0 auto 14px;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      p { font-size: 13px; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <p>Starting Trova IMS…</p>
    </div>
  </body>
</html>
