[package]
name = "trova-ims"
version = "1.5.0" # x-release-please-version
description = "Trova IMS — offline desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-thermal-printer = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Final race guard after startup replacement terminates older app versions.
tauri-plugin-single-instance = "2"

[[bin]]
name = "trova-ims"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
