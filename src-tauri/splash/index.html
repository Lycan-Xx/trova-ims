<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trova IMS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #9a9a9f;
      }
      .wrap { text-align: center; }
      .wrap.error { max-width: 560px; padding: 24px; }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 18px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
      h1 {
        margin: 0 0 6px;
        color: #f4f4f5;
        font-size: 18px;
        font-weight: 650;
      }
      .tagline {
        margin: 0 0 22px;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #9a9a9f;
      }
      p { font-size: 13px; letter-spacing: 0.02em; }
      .version {
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 0.03em;
        color: #5a5a60;
      }
      .message {
        margin: 0 auto;
        max-width: 520px;
        color: #d4d4d8;
        line-height: 1.55;
      }
      .log {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #2f2f35;
        border-radius: 6px;
        background: #141417;
        color: #a1a1aa;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
    </style>
    <script>
      window.trovaStartupError = function (message, logPath) {
        const wrap = document.querySelector('.wrap')
        if (!wrap) return
        wrap.classList.add('error')
        wrap.innerHTML = [
          '<h1>Trova IMS could not start</h1>',
          '<p class="message"></p>',
          '<div class="log"></div>',
        ].join('')
        wrap.querySelector('.message').textContent = message
        wrap.querySelector('.log').textContent = 'Server log: ' + logPath
      }
    </script>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="./logo.png" alt="Trova IMS" />
      <h1>Trova IMS</h1>
      <p class="tagline">Stock. Sales. Simplified.</p>
      <p>Starting…</p>
      <div class="version">v1.5.0</div>
    </div>
  </body>
</html>
