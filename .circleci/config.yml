version: 2.1

# Orbs provide reusable commands and executors
orbs:
  node: circleci/node@5.2.0
  rust: circleci/rust@1.6.1
  win: circleci/windows@5.0.0

# Define parameters for manual workflow triggers
parameters:
  build-profile:
    type: enum
    enum: ["release", "debug"]
    default: "release"

# Define executors for different platforms
executors:
  linux-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Placeholder secrets - override with CircleCI project environment variables
      DATABASE_URL: postgres://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: build-time-placeholder-not-used-for-signing

  windows-builder:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.large
    shell: powershell.exe -ExecutionPolicy Bypass
    environment:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: build-time-placeholder-not-used-for-signing

# Reusable commands
commands:
  install-node-deps:
    description: "Install Node.js dependencies"
    steps:
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

  install-rust:
    description: "Install Rust toolchain"
    steps:
      - restore_cache:
          keys:
            - rust-{{ arch }}-{{ checksum "src-tauri/Cargo.lock" }}
            - rust-{{ arch }}-
      - run:
          name: Install Rust
          command: |
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v rustc &> /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
              source $BASH_ENV
            fi
            rustc --version
            cargo --version

  install-linux-deps:
    description: "Install Linux system dependencies for Tauri"
    steps:
      - run:
          name: Update package lists and install dependencies
          command: |
            # Fix Ubuntu mirrors to use main archive
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true
            sudo sed -i 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true
            
            # Retry apt-get update up to 3 times
            for i in 1 2 3; do
              echo "Attempt $i: Updating package lists..."
              if sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3; then
                break
              elif [ $i -lt 3 ]; then
                echo "Attempt $i failed, retrying..."
                sleep 10
              else
                echo "All retry attempts failed!"
                exit 1
              fi
            done
            
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -o Dpkg::Options::=--force-confold \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              build-essential \
              curl \
              wget \
              file

  build-tauri-app:
    description: "Build Tauri desktop application"
    parameters:
      bundles:
        type: string
        description: "Comma-separated list of bundle types"
      profile:
        type: enum
        enum: ["release", "debug"]
        default: "release"
    steps:
      - run:
          name: Build Tauri app
          command: |
            DEBUG_FLAG=""
            if [ "<< parameters.profile >>" = "debug" ]; then
              DEBUG_FLAG="--debug"
            fi
            
            echo "Starting Tauri build with bundles: << parameters.bundles >>"
            echo "Profile: << parameters.profile >>"
            
            set -e  # Exit on any error
            npm run desktop:build -- ${DEBUG_FLAG} --bundles << parameters.bundles >> || {
              echo "Build failed, checking for common issues..."
              exit 1
            }
          no_output_timeout: 30m

# Jobs definition
jobs:
  build-linux:
    executor: linux-builder
    steps:
      - checkout
      - node/install:
          node-version: "20"
      - install-rust
      - install-linux-deps
      - install-node-deps
      - restore_cache:
          keys:
            - rust-build-linux-safe-{{ checksum "src-tauri/Cargo.lock" }}
      - build-tauri-app:
          bundles: "deb,rpm"
          profile: << pipeline.parameters.build-profile >>
      - save_cache:
          key: rust-build-linux-safe-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - src-tauri/target
      - store_artifacts:
          path: src-tauri/target/<< pipeline.parameters.build-profile >>/bundle
          destination: linux-build
      - persist_to_workspace:
          root: src-tauri/target
          paths:
            - << pipeline.parameters.build-profile >>/bundle/deb
            - << pipeline.parameters.build-profile >>/bundle/rpm

  build-windows:
    executor: windows-builder
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: |
            choco install nodejs --version=20.11.1 -y
            node --version
            npm --version
      - run:
          name: Install Rust and build tools
          command: |
            # Install Visual Studio Build Tools (includes required C++ toolchain)
            choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64" -y
            
            # Install Rust with the native Windows MSVC toolchain.
            $target = "x86_64-pc-windows-msvc"
            $toolchain = "stable-$target"
            $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:Path = "$cargoBin;$env:Path"

            if (!(Test-Path (Join-Path $cargoBin "rustup.exe"))) {
              Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain stable
              Remove-Item rustup-init.exe
            }
            
            # Install the target on the exact toolchain that Cargo will use.
            rustup toolchain install $toolchain --profile minimal --target $target
            rustup target add $target --toolchain $toolchain
            rustup default $toolchain

            # Make Rust available to subsequent CircleCI Windows steps too.
            [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Machine)
            
            # Verify installation
            rustup run $toolchain rustc --version
            rustup target list --installed --toolchain $toolchain
            rustup run $toolchain cargo --version
            echo "Build tools installed successfully"
      - restore_cache:
          keys:
            - npm-deps-win-{{ checksum "package-lock.json" }}
            - npm-deps-win-
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-win-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - restore_cache:
          keys:
            - rust-build-windows-msvc-safe-{{ checksum "src-tauri/Cargo.lock" }}
      - run:
          name: Build Tauri app
          command: |
            # Discard any target artifacts made with the GNU target. Those
            # artifacts invoke dlltool, which is not part of the MSVC build.
            $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:Path = "$cargoBin;$env:Path"
            $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
            $env:CARGO_BUILD_TARGET = "x86_64-pc-windows-msvc"
            rustup run $env:RUSTUP_TOOLCHAIN rustc -vV
            rustup target add $env:CARGO_BUILD_TARGET --toolchain $env:RUSTUP_TOOLCHAIN
            cargo clean --target $env:CARGO_BUILD_TARGET --manifest-path src-tauri/Cargo.toml
            $debugFlag = ""
            if ("<< pipeline.parameters.build-profile >>" -eq "debug") {
              $debugFlag = "--debug"
            }
            npm run desktop:build -- $debugFlag --target $env:CARGO_BUILD_TARGET --bundles msi,nsis
          no_output_timeout: 30m
      - save_cache:
          key: rust-build-windows-msvc-safe-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - src-tauri/target
      - store_artifacts:
          path: src-tauri/target/<< pipeline.parameters.build-profile >>/bundle
          destination: windows-build
      - persist_to_workspace:
          root: src-tauri/target
          paths:
            - << pipeline.parameters.build-profile >>/bundle/msi
            - << pipeline.parameters.build-profile >>/bundle/nsis

  collect-artifacts:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/artifacts
      - store_artifacts:
          path: /tmp/artifacts
          destination: all-builds
      - run:
          name: List all artifacts
          command: |
            echo "=== Build Artifacts ==="
            find /tmp/artifacts -type f

# Workflows
workflows:
  version: 2

  # Main workflow - runs on main and separation-attempt branches
  build-desktop-apps:
    jobs:
      - build-linux:
          filters:
            branches:
              only:
                - main
                - separation-attempt
      - build-windows:
          filters:
            branches:
              only:
                - main
                - separation-attempt
      - collect-artifacts:
          requires:
            - build-linux
            - build-windows
          filters:
            branches:
              only:
                - main
                - separation-attempt

  # Tag-based workflow - runs only on git tags
  build-on-tags:
    jobs:
      - build-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - collect-artifacts:
          requires:
            - build-linux
            - build-windows
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
