name: Build Desktop App (Tauri)

# Manual only — this does not run on every push. Trigger it from the
# Actions tab ("Run workflow") whenever a desktop build is actually
# wanted.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            # AppImage requires FUSE which GitHub runners don't provide.
            # Ship .deb (Ubuntu/Debian) and .rpm (Fedora/RHEL) instead —
            # both work reliably on CI without any extra setup.
            bundles: deb,rpm
          - platform: windows-latest
            name: windows
            bundles: msi,nsis
          - platform: macos-latest
            name: macos
            bundles: dmg

    runs-on: ${{ matrix.platform }}
    # Safety net: Rust release builds + Tauri bundling normally finish
    # well under this on a cold cache. If a step ever hangs silently
    # (as apt-get did against the azure mirror), this caps the damage
    # at 45 minutes of runner time instead of hours.
    timeout-minutes: 45

    # Placeholder secrets so `next build` doesn't fail at the app's own
    # startup validation (lib/db/index.ts, lib/auth.ts). The build only
    # needs *truthy* values here — pg.Pool doesn't connect until a query
    # actually runs, and nothing runs a query at build time; the auth
    # secret is likewise only used to sign sessions at runtime, not
    # checked at build time. This has no effect on the packaged app's
    # actual runtime database connection. Override with repo secrets of
    # the same names if a build should embed different values.
    env:
      DEBIAN_FRONTEND: noninteractive
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://build:build@localhost:5432/build' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'build-time-placeholder-not-used-for-signing' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri's Linux bundler needs these system libraries.
      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          # The ubuntu-22.04 runner defaults to the azure.archive.ubuntu.com
          # mirror, which is unreliable and can hang `apt-get update` for
          # hours on silent timeouts instead of failing fast. Point at the
          # main Ubuntu archive directly before updating.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        # `tauri build` runs scripts/tauri-prebuild.mjs first (via
        # beforeBuildCommand in tauri.conf.json), which builds the
        # Next.js standalone server before Tauri packages it.
        # --bundles restricts output to the formats that work on each
        # runner without extra setup (no AppImage on Linux CI).
        run: >
          npm run desktop:build --
          ${{ inputs.profile == 'debug' && '--debug' || '' }}
          --bundles ${{ matrix.bundles }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trova-ims-${{ matrix.name }}-${{ inputs.profile }}
          path: |
            src-tauri/target/${{ inputs.profile }}/bundle/**
          if-no-files-found: error
          retention-days: 14
