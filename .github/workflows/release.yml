name: Release

# Runs on every push to main. release-please opens (and keeps updated)
# a "Release PR" that bumps the version and builds the changelog from
# conventional commits. Merging that PR triggers the second job, which
# runs the Tauri build and attaches the installers to the GitHub Release
# that release-please just created.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Step 1: let release-please manage the version + changelog ─────────────
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node
          # Keeps the version in package.json in sync with the release tag.
          # Also updates src-tauri/Cargo.toml automatically.
          extra-files: |
            src-tauri/Cargo.toml

  # ── Step 2: build Windows installers and attach them to the release ───────
  # Only runs when release-please actually created a new release (i.e.
  # the Release PR was just merged). Skipped on regular feature pushes.
  build-and-upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-slim
            variant: slim
            bundles: msi,nsis
          - platform: windows-latest
            name: windows-bundled
            variant: bundled
            bundles: msi,nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://build:build@localhost:5432/build' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'build-time-placeholder-not-used-for-signing' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        run: >
          npm run desktop:build --
          --variant ${{ matrix.variant }}
          --target x86_64-pc-windows-msvc
          --bundles ${{ matrix.bundles }}

      # Upload each Windows installer variant directly to the GitHub Release
      # that release-please created. Users download from the Releases page
      # rather than from workflow artifact zips.
      - name: Upload Windows installers
        run: |
          $assets = @(
            (Get-ChildItem src-tauri/target/release/bundle/msi/*windows-${{ matrix.variant }}*.msi).FullName
            (Get-ChildItem src-tauri/target/release/bundle/nsis/*windows-${{ matrix.variant }}*.exe).FullName
          )
          gh release upload ${{ needs.release-please.outputs.tag_name }} $assets --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

