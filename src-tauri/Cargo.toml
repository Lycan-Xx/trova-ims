[package]
name = "trova-ims"
version = "0.1.0"
description = "Trova IMS — offline desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Ensures only one instance of the app can run at a time. A second launch
# attempt hands off to the already-running instance (focuses its window)
# instead of spawning a competing Node server on the same fixed port.
tauri-plugin-single-instance = "2"

[[bin]]
name = "trova-ims"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
