name: Release

# Runs on every push to main. release-please opens (and keeps updated)
# a "Release PR" that bumps the version and builds the changelog from
# conventional commits. Merging that PR triggers the second job, which
# runs the Tauri build and attaches the installers to the GitHub Release
# that release-please just created.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Step 1: let release-please manage the version + changelog ─────────────
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node
          # Keeps the version in package.json in sync with the release tag.
          # Also updates src-tauri/Cargo.toml automatically.
          extra-files: |
            src-tauri/Cargo.toml

  # ── Step 2: build installers and attach them to the release ───────────────
  # Only runs when release-please actually created a new release (i.e.
  # the Release PR was just merged). Skipped on regular feature pushes.
  build-and-upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            bundles: deb,rpm
          - platform: windows-latest
            name: windows
            bundles: msi,nsis
          - platform: macos-latest
            name: macos
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://build:build@localhost:5432/build' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'build-time-placeholder-not-used-for-signing' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        run: >
          npx tauri build
          --bundles ${{ matrix.bundles }}

      # Upload each platform's installer(s) directly to the GitHub Release
      # that release-please created. Users download from the Releases page
      # rather than from workflow artifact zips.
      - name: Upload Linux installers
        if: matrix.name == 'linux'
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} `
            (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi).FullName `
            (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName `
            --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS installer
        if: matrix.name == 'macos'
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
